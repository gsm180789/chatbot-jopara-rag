services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jopara_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jopara_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yeshua}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot_jopara_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: